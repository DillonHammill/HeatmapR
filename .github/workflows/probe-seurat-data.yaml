# TEMPORARY: probe the SeuratData datasets for the single-cell guide
on:
  push:
    branches: [feature/seurat-data]
  workflow_dispatch:

name: probe-seurat-data

permissions: read-all

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::Seurat, any::remotes, local::.
          needs: website
      - name: Install SeuratData
        run: remotes::install_github("satijalab/seurat-data", dependencies = NA, upgrade = "never")
        shell: Rscript {0}
      - name: Probe
        run: Rscript data-raw/probe/seurat-data-probe.R
