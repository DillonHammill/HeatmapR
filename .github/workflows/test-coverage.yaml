# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          # The lines that no test runs, as runs of lines in each file, so the
          # log says what to test without a Codecov upload
          missed <- covr::zero_coverage(cov)
          if(nrow(missed) > 0) {
            cat("\nLines not covered:\n")
            for(file in unique(missed$filename)) {
              lines <- sort(unique(missed$line[missed$filename == file]))
              runs <- split(lines, cumsum(c(1, diff(lines) != 1)))
              runs <- vapply(runs, function(run) {
                if(length(run) == 1) as.character(run) else paste0(run[1], "-", run[length(run)])
              }, character(1))
              cat(file, ": ", paste(runs, collapse = ", "), "\n", sep = "")
            }
          }
          # Codecov needs a token for uploads from branches of this repository
          # (the CODECOV_TOKEN secret), and covr >= 4.0.0 fails when an upload
          # fails - without the secret the upload is skipped with a warning
          if(nzchar(Sys.getenv("CODECOV_TOKEN"))) {
            covr::codecov(coverage = cov, token = Sys.getenv("CODECOV_TOKEN"))
          } else {
            warning("The CODECOV_TOKEN secret isn't set, so the coverage wasn't uploaded to Codecov.")
          }
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find ${{ runner.temp }}/package -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
