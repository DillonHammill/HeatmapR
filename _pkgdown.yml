url: https://dillonhammill.github.io/HeatmapR/
template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles, singlecell, app, benchmarks, news]
  components:
    singlecell:
      text: Single-cell
      menu:
      - text: Single-cell data
        href: articles/single-cell.html
      - text: Markers, dot plots and gene sets
        href: articles/markers.html
      - text: Samples and conditions
        href: articles/conditions.html
      - text: Cytometry
        href: articles/cytometry.html
      - text: Trajectories
        href: articles/trajectories.html
    app:
      text: App
      href: articles/app.html
    benchmarks:
      text: Speed
      href: articles/benchmarks.html

articles:
- title: Get started
  navbar: ~
  contents:
  - HeatmapR
- title: Guides
  navbar: Guides
  desc: >
    Deeper looks at what HeatmapR can do, with every figure drawn as the
    site is built.
  contents:
  - articles/app
  - articles/ordering
  - articles/large-data
  - articles/cells
  - articles/integration
- title: Single-cell data
  navbar: Single-cell data
  desc: >
    Heatmaps, dot plots, markers, conditions, cytometry and trajectories of
    single-cell data, read from SingleCellExperiment and Seurat objects,
    AnnData files and cytometry files.
  contents:
  - articles/single-cell
  - articles/markers
  - articles/conditions
  - articles/cytometry
  - articles/trajectories
- title: Performance
  navbar: Performance
  contents:
  - articles/benchmarks

reference:
- title: Draw heatmaps
  contents:
  - heat_map
  - heat_map_cor
  - heat_map_align
  - heat_map-methods
  - heat_map_style
  - heat_map_app
- title: Inspect and describe heatmaps
  desc: >
    Extract the order, clusters, colours and layout of a heatmap, or describe
    it in plain language as alternative text.
  contents:
  - heat_map_info
  - heat_map_describe
  - print.heat_map_description
  - heat_map_check_colours
  - heat_map_html
- title: Use heatmaps with other tools
  desc: >
    Combine heatmaps with ggplot2 plots, or export their contents as tidy data.
  contents:
  - heat_map_grob
  - heat_map_data
- title: Single-cell data
  desc: >
    Read AnnData files, rank markers, score gene sets, smooth along
    trajectories, and draw dot plots, compositions and contrasts of groups of
    cells. heat_map() and heat_map_summarise() read single-cell data too.
  contents:
  - heat_map_dot
  - heat_map_markers
  - heat_map_score
  - heat_map_composition
  - heat_map_contrast
  - heat_map_smooth
  - heat_map_downsample
  - heat_map_read_h5ad
  - heat_map_example
- title: Prepare data
  desc: >
    Scale, summarise and cluster data before (or while) drawing a heatmap.
  contents:
  - heat_map_scale
  - heat_map_summarise
  - heat_map_clust
  - heat_map_threads
- title: Arrange and save heatmaps
  desc: >
    Arrange heatmaps with other plots in custom layouts and save high
    resolution images.
  contents:
  - heat_map_arrange
  - heat_map_custom
  - heat_map_layout
  - heat_map_new
  - heat_map_record
  - heat_map_complete
  - heat_map_save
  - heat_map_reset
